<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Địa Chủ Tập Sự</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Bố cục: menu giữa màn hình; trận đấu = 2 cột người chơi hai bên, bàn cờ 3D ở giữa, dock điều khiển phía dưới */
:root{--bg0:#0b0820;--panel:#1d1646;--panel2:#2a2062;--line:#4a3d96;--tx:#f4f0ff;--mut:#a9a1d8;--gold:#ffd166;--pink:#ff8fb8;--mint:#72e6c4;--lav:#b9a7ff;--sky:#7cc4ff;--red:#ff6b81;--disp:'Baloo 2','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--tilt:34deg;--rot:0deg;--bs:640px;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg0)}
body{margin:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--tx);font:700 15px/1.35 var(--body);min-height:100vh;background:radial-gradient(1100px 700px at 15% -10%,#35208a 0%,transparent 60%),radial-gradient(900px 600px at 105% 105%,#52185f 0%,transparent 55%),var(--bg0);overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:800}
.screen{display:none}.screen.on{display:block}
.btn{border:0;border-radius:14px;padding:.6em 1.1em;font-weight:800;background:linear-gradient(#5b4bc4,#43369e);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.35);transition:transform .12s,filter .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:linear-gradient(#ffe08a,#f5b83d);color:#4a2f00}
.btn.pink{background:linear-gradient(#ff9ec4,#e8588f)}
.btn.mint{background:linear-gradient(#8cf0d2,#3fc3a1);color:#053b2f}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:.35em .75em;font-size:13px;border-radius:11px}
.btn.big{padding:.8em 1.6em;font-size:18px;border-radius:18px;font-family:var(--disp)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:0;border-radius:999px;padding:.35em .9em;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:14px}
.chip.on{background:var(--lav);color:#241a5c;box-shadow:none}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.mut{color:var(--mut)}
input[type=text],input[type=number]{background:rgba(255,255,255,.08);border:1.5px solid var(--line);color:var(--tx);border-radius:12px;padding:.5em .8em;min-width:0;width:100%}
/* ---- menu ---- */
#menu{text-align:center;padding:18px 0 30px}
.hero-av{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ttl{font-size:clamp(44px,9vw,92px);line-height:1;background:linear-gradient(#fff 0,#ffe08a 45%,#ff8fb8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b2f9c) drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.sub{color:var(--lav);letter-spacing:.28em;text-transform:uppercase;font-size:13px;margin:10px 0 24px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:820px;margin:0 auto}
.menu-grid .btn{padding:1em;font-size:18px;font-family:var(--disp)}
.menu-grid small{display:block;font:600 12px var(--body);opacity:.8;margin-top:2px}
.xu{margin-top:20px;color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{flex:1;font-size:26px;min-width:150px}
/* ---- setup ---- */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.seat{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.seat .av{filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
/* ---- wardrobe ---- */
.wd{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:16px}
@media(max-width:820px){.wd{grid-template-columns:1fr}}
.pedestal{position:relative;display:flex;justify-content:center;padding:16px 0 28px;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.22),transparent 65%);border-radius:18px}
.pedestal::after{content:'';position:absolute;left:18%;right:18%;bottom:12px;height:16px;border-radius:50%;background:radial-gradient(#b9a7ff,#4a3d96);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pedestal .av{position:relative;z-index:1;animation:bob 4s ease-in-out infinite}
.grp{margin-top:12px}.grp>b{display:block;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.4)}
.sw.on{border-color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.it{position:relative;border:0;border-radius:16px;padding:8px 6px 8px;background:linear-gradient(#ffffff14,#ffffff06);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;font-size:12px;line-height:1.2}
.it.on{box-shadow:inset 0 0 0 3px var(--gold),0 0 18px rgba(255,209,102,.35)}
.it .ti2{font-size:26px;height:44px;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
/* ---- game layout ---- */
#game.on{display:grid;grid-template-columns:minmax(185px,235px) minmax(0,1fr) minmax(185px,235px);grid-template-areas:"top top top" "l stage r" "dock dock dock";gap:10px;align-items:start}
#top{grid-area:top;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#top .tt{font:800 22px var(--disp);margin-right:auto}
#pl{grid-area:l}#pr{grid-area:r}#stage{grid-area:stage}#dock{grid-area:dock}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
@media(max-width:980px){#game.on{grid-template-columns:1fr 1fr;grid-template-areas:"top top" "stage stage" "dock dock" "l r"}}
.pc{padding:10px;border-radius:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);position:relative;transition:box-shadow .25s}
.pc.turn{box-shadow:0 0 0 2.5px var(--pcol),0 0 22px var(--pcol)}
.pc.out{filter:grayscale(1) opacity(.5)}
.pc .hd{display:flex;gap:8px;align-items:center}
.pc .nmx{font:800 16px var(--disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .mn{color:var(--gold);font:800 20px var(--disp);font-variant-numeric:tabular-nums}
.pc .tag{font-size:11px;color:var(--mut)}
.pc .avw{flex:none;width:50px;height:62px;border-radius:14px;background:radial-gradient(circle at 50% 30%,#ffffff30,#ffffff08);display:flex;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px var(--pcol)}
.pp{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pp button{width:20px;height:26px;border:0;border-radius:5px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.5);padding:0;font-size:9px;font-weight:800;color:#0006}
.pp button.m{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,0,0,.45) 3px 5px)!important;opacity:.7}
.pp i{position:absolute;bottom:-3px;right:-3px;background:#fff;color:#23233a;border-radius:6px;font-size:9px;font-style:normal;padding:0 3px;line-height:12px;font-weight:800}
.jc{display:inline-block;margin-top:6px;font-size:12px;color:var(--mint)}
#dock{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px}
#dock .st{flex:1 1 240px;min-width:0}
#dock .st b{font:800 18px var(--disp);display:block}
#dock .acts{display:flex;gap:8px;flex-wrap:wrap}
.logbox{max-height:130px;overflow:auto;font-size:12px;color:var(--mut);line-height:1.35;padding:8px;border-radius:12px;background:rgba(0,0,0,.22)}
.logbox div{padding:1px 0}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.view{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.view input[type=range]{width:110px;accent-color:var(--lav)}
.scene{width:var(--bs);height:calc(var(--bs)*.92);perspective:calc(var(--bs)*2.1);perspective-origin:50% 30%;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;position:relative;max-width:none}
.scene.drag{cursor:grabbing}
.b3d{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);transform-style:preserve-3d;transform:rotateX(var(--tilt)) rotateZ(var(--rot))}
.plane{position:absolute;inset:0;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;padding:.8%;border-radius:2.4%;font-size:max(5.4px,calc(var(--bs)*.0112));background:linear-gradient(145deg,#fff8ee,#efe3ff);box-shadow:0 1px 0 #cdbbea,0 2px 0 #c6b2e6,0 3px 0 #bea8e0,0 4px 0 #b59fda,0 5px 0 #a98fd2,0 6px 0 #9d83c9,0 7px 0 #8f74be,0 8px 0 #8268b2,0 9px 0 #765ca6,0 10px 0 #6a509a,0 34px 50px rgba(0,0,0,.55)}
.tile{position:relative;background:#fffaf4;box-shadow:inset 0 0 0 .07em #d6c6ee;cursor:pointer}
.tile:hover{filter:brightness(1.04)}
.ti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#3a2f5a;font-weight:800;line-height:1.08;pointer-events:none}
.sl .ti{inset:auto;left:50%;top:50%;width:64.5%;height:155%;transform:translate(-50%,-50%) rotate(90deg)}
.sr .ti{inset:auto;left:50%;top:50%;width:64.5%;height:155%;transform:translate(-50%,-50%) rotate(-90deg)}
.sT .ti{transform:rotate(180deg)}
.strip{width:100%;height:23%;flex:none;display:flex;justify-content:center;align-items:flex-end;gap:.2em;border-bottom:.1em solid rgba(0,0,0,.2);box-shadow:inset 0 .25em 0 rgba(255,255,255,.35),inset 0 -.2em 0 rgba(0,0,0,.12)}
.nm{flex:1;display:flex;align-items:center;justify-content:center;font-size:.95em;padding:.2em .25em;word-break:break-word}
.ic{font-size:1.9em;line-height:1;margin:.1em 0}
.pr{font-size:.95em;color:#6a4fb8;padding-bottom:.35em}
.fill{flex:1;display:flex;align-items:center}
.hs{width:1.45em;height:1.15em;border-radius:.2em;background:linear-gradient(#69e29c,#2ecc71 55%,#209a55);position:relative;margin:0 0 .15em;box-shadow:0 .15em .2em rgba(0,0,0,.35),inset 0 .15em 0 rgba(255,255,255,.5);flex:none}
.hs::before{content:'';position:absolute;left:-.15em;right:-.15em;top:-.6em;height:.65em;background:linear-gradient(#35b36a,#1b7a43);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hs::after{content:'';position:absolute;left:.3em;top:.45em;width:.3em;height:.35em;background:#fff8;border-radius:.05em;box-shadow:.5em 0 #fff8}
.ht{width:2.6em;height:1.4em;border-radius:.25em;background:linear-gradient(#ff8a8a,#e23b3b 55%,#b02323);position:relative;margin:0 0 .15em;box-shadow:0 .2em .25em rgba(0,0,0,.4),inset 0 .15em 0 rgba(255,255,255,.5)}
.ht::before{content:'';position:absolute;left:-.2em;right:-.2em;top:-.5em;height:.55em;background:linear-gradient(#fff,#d9d4e8);border-radius:.25em .25em 0 0}
.ht::after{content:'';position:absolute;inset:.3em .3em .25em;background:repeating-linear-gradient(90deg,#fff8 0 .25em,transparent .25em .55em)}
.owned::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 .22em var(--oc),0 0 .9em var(--oc);pointer-events:none;z-index:2}
.owndot{position:absolute;right:.3em;bottom:.3em;width:1.2em;height:1.2em;border-radius:50%;background:var(--oc);box-shadow:inset 0 .12em 0 rgba(255,255,255,.5),0 .1em .25em rgba(0,0,0,.5);z-index:3}
.mort .ti{opacity:.45}
.mort::before{content:'THẾ CHẤP';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9em;font-weight:800;color:#fff;background:repeating-linear-gradient(45deg,rgba(60,40,100,.55) 0 .5em,rgba(60,40,100,.7) .5em 1em);z-index:2;letter-spacing:.05em}
.neon{box-shadow:inset 0 0 0 .1em var(--nc),inset 0 0 1em color-mix(in srgb,var(--nc) 55%,transparent);animation:neon 3.2s ease-in-out infinite}
@keyframes neon{50%{box-shadow:inset 0 0 0 .14em var(--nc),inset 0 0 1.8em var(--nc)}}
.tflash{position:absolute;inset:0;background:#fff;z-index:5;animation:flash .8s ease-out forwards;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.corner .ti{justify-content:center;gap:.2em;padding:.4em}
.corner .big{font-size:3em;line-height:1}
.corner .lb{font-size:1.1em}
.jailcell{position:absolute;right:0;top:0;width:66%;height:66%;background:#ffb347;box-shadow:inset 0 0 0 .15em #333;z-index:1}
.jailcell::after{content:'';position:absolute;inset:.35em;background:repeating-linear-gradient(90deg,#2e2a3a 0 .22em,transparent .22em .9em)}
.jailtxt{position:absolute;left:.4em;bottom:.4em;font-size:1em;font-weight:800;color:#3a2f5a;z-index:1}
.center{grid-area:2/2/11/11;position:relative;border-radius:1.5%;background:radial-gradient(circle at 28% 18%,#fff 0,#f1e8ff 55%,#e1d3ff 100%);box-shadow:inset 0 .3em 1em rgba(90,60,160,.28)}
.logo{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) rotate(-22deg);font:800 9.2em/1 var(--disp);letter-spacing:.02em;color:#e8344f;text-shadow:0 .04em 0 #b01c35,0 .08em 0 #8c1229,0 .13em .12em rgba(0,0,0,.3),.03em 0 #fff,-.03em 0 #fff;white-space:nowrap;pointer-events:none}
.logo small{display:block;font:800 .2em var(--body);letter-spacing:.5em;color:#7a5cc4;text-shadow:none;text-align:center}
.deck{position:absolute;width:19%;height:25%}
.deck .cd{position:absolute;inset:0;border-radius:.6em;box-shadow:0 .2em .3em rgba(0,0,0,.35)}
.deck .cd:nth-child(1){transform:translate(.25em,.35em)}.deck .cd:nth-child(2){transform:translate(.12em,.18em)}
.tarot{background:radial-gradient(circle at 50% 40%,#5d3fc7 0,#2a1a6b 70%);border:.16em solid #ffd166;color:#ffd166;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.95em;gap:.25em;text-align:center}
.tarot.c1{background:radial-gradient(circle at 50% 40%,#ff9f43 0,#a8500f 80%)}
.tarot svg{width:55%;height:auto}
.dice{position:absolute;left:50%;top:67%}
.dw{position:absolute;width:5.8em;height:5.8em;transform-style:preserve-3d}
.dsh{position:absolute;width:5.8em;height:5.8em;border-radius:22%;background:rgba(40,20,80,.5);filter:blur(.45em)}
.dw .cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.12,.75,.2,1)}
.dw .f{position:absolute;inset:0;border-radius:20%;background:linear-gradient(145deg,#fff,#e6dcfb);box-shadow:inset 0 0 .7em rgba(120,95,180,.45),inset 0 .15em 0 #fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.75em;place-items:center}
.dw .f::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.55),transparent 40%);pointer-events:none}
.p{width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b3,#e0a92b 60%,#946510);box-shadow:inset 0 -.1em .1em rgba(0,0,0,.25)}
.f1{transform:translateZ(2.9em)}.f6{transform:rotateY(180deg) translateZ(2.9em)}.f3{transform:rotateY(90deg) translateZ(2.9em)}.f4{transform:rotateY(-90deg) translateZ(2.9em)}.f2{transform:rotateX(90deg) translateZ(2.9em)}.f5{transform:rotateX(-90deg) translateZ(2.9em)}
.dw.mb::after{content:'';position:absolute;inset:-.4em;border-radius:30%;background:rgba(255,255,255,.55);filter:blur(.7em);animation:mb 1s forwards;z-index:-1}
@keyframes mb{0%{opacity:.8}100%{opacity:0}}
.cbanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 1.5em var(--disp);color:#4a3a90;background:#fff;border-radius:2em;padding:.15em .9em;box-shadow:0 .15em .6em rgba(80,50,150,.3);white-space:nowrap;border:.12em solid var(--pcol,#b9a7ff)}
.clog{position:absolute;left:3%;bottom:3%;width:36%;height:24%;overflow:hidden;font-size:.95em;line-height:1.25;font-weight:700;color:#5a4a8a;display:flex;flex-direction:column;justify-content:flex-end}
.clog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tokens{position:absolute;inset:.8%;transform-style:preserve-3d;pointer-events:none}
.tk{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .28s linear,top .28s linear}
.tk .base{position:absolute;left:-2em;top:-2em;width:4em;height:4em;border-radius:50%;background:radial-gradient(circle,var(--pcol) 0 45%,transparent 70%);opacity:.75}
.tk .bd{position:absolute;left:-3.1em;top:0;width:6.2em;transform-origin:50% 0;transform:rotateZ(calc(var(--rot)*-1)) rotateX(calc(var(--tilt)*-1)) translateY(-100%)}
.tk .hop{display:block}
.tk .hop.hp{animation:hop .3s ease-out}
@keyframes hop{50%{transform:translateY(-1.6em) scale(1.06,.94)}}
.tk .bd svg{width:100%;height:auto;display:block;filter:drop-shadow(0 .2em .15em rgba(0,0,0,.3))}
.tk .lab{position:absolute;left:50%;top:-.2em;transform:translate(-50%,-100%);font-size:.9em;background:var(--pcol);color:#1a1238;border-radius:1em;padding:0 .5em;font-weight:800;white-space:nowrap}
.pt{position:absolute;width:0;height:0;transform:rotateZ(calc(var(--rot)*-1)) rotateX(calc(var(--tilt)*-1))}
.pt i{position:absolute;left:-.8em;top:-.8em;font-style:normal;font-size:1.6em;animation:ptf 1.1s ease-out forwards;opacity:0}
@keyframes ptf{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-3.4em) scale(1.1) rotate(var(--rr,0deg))}}
.ft{position:absolute;width:0;height:0;transform:rotateZ(calc(var(--rot)*-1)) rotateX(calc(var(--tilt)*-1));z-index:9}
.ft i{position:absolute;left:0;top:0;transform:translateX(-50%);font:800 2.3em var(--disp);font-style:normal;white-space:nowrap;animation:fl 1.6s ease-out forwards;text-shadow:0 .08em 0 rgba(0,0,0,.35),0 0 .5em currentColor}
.ft.good i{color:#46e39a}.ft.bad i{color:#ff6b81}.ft.gold i{color:#ffd166}
@keyframes fl{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-1.2em) scale(1.12)}100%{opacity:0;transform:translate(-50%,-5em) scale(1)}}
.shk{animation:shk .4s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
/* ---- overlays ---- */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(8,5,28,.66);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.md{width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px;padding:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
.md.wide{max-width:760px}
.md h3{font-size:22px;margin-bottom:8px}
.deed{background:#fffaf4;color:#2c2350;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35);margin:8px auto;max-width:300px}
.deed .dh{padding:12px;text-align:center;font:800 19px var(--disp);color:#23233a;border-bottom:3px solid #23233a}
.deed .dh small{display:block;font:700 11px var(--body);letter-spacing:.1em}
.deed table{width:100%;border-collapse:collapse;font-size:14px}
.deed td{padding:3px 14px}.deed td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.deed .own{padding:8px;text-align:center;font-size:13px;background:#efe6ff}

const cp=()=>G?.players?.[G.cur];
function fx(e){e.id=++G.fxn;G.fx.push(e);if(G.fx.length>120)G.fx.shift()}
function log(c,t){G.log.push({c,t});if(G.log.length>80)G.log.shift()}
const fl=(tile,text,cls)=>fx({k:'float',tile,text,cls});
const snd=n=>fx({k:'sound',n});
function botEmote(pid,i){const p=G.players[pid];if(!p||!p.bot||p.out||Math.random()>.55||Date.now()-(p.et||0)<2500)return;p.et=Date.now();fx({k:'emote',pid,e:i,q:1})}
function botThrow(pid,to,force){const p=G.players[pid],t=G.players[to];if(!p||!t||!p.bot||p.out||t.out||pid===to||Date.now()-(p.tt||0)<(force?1200:4000))return;p.tt=Date.now();const i=rnd(3);fx({k:'throw',from:pid,to,i,q:1});log(pid,`${p.name} ném ${THR[i].v} vào ${t.name}`)}

function newGame(seats){
 const players=seats.map((s,i)=>({id:i,name:s.name,cfg:s.cfg,bot:s.bot||0,net:s.net||null,money:1500,pos:0,jail:false,jt:0,fc:[],out:false,col:PCOL[i]}));
 G={players,own:Array(40).fill(-1),hs:Array(40).fill(0),mort:Array(40).fill(false),cur:0,phase:'roll',dbl:false,doubles:0,bank:{h:32,H:12},log:[],fx:[],fxn:0,rollId:0,last:{id:0,d1:1,d2:1},auction:null,debt:null,trade:null,winner:-1,deck:{ch:shuffle([...Array(16).keys()]),cc:shuffle([...Array(16).keys()])},turnNo:1,tradeTry:-9};
 let best=0,bs=-1;
 players.forEach(p=>{const r=rd()+rd();log(p.id,`${p.name} tung xúc xắc được ${r}`);const s=r+Math.random()*.5;if(s>bs){bs=s;best=p.id}});
 G.cur=best;log(best,`${players[best].name} đi trước!`);snd('start');
 return G}

function ownsAll(o,g){return GRP[g].every(i=>G.own[i]===o)}
const owned=pid=>{const r=[];for(let i=0;i<40;i++)if(G.own[i]===pid)r.push(i);return r};
function rentOf(i,ds,opt){const t=T[i],o=G.own[i];opt=opt||{};
 if(t.t==='st'){const h=G.hs[i];if(h>0)return t.rent[h];return t.rent[0]*(ownsAll(o,t.g)?2:1)}
 if(t.t==='rr'){const n=RRS.filter(k=>G.own[k]===o).length;return 25*(1<<(n-1))*(opt.double?2:1)}
 const n=UTS.filter(k=>G.own[k]===o).length;return ds*(opt.ten?10:(n===2?10:4))}
function liquid(p){let s=p.money;owned(p.id).forEach(i=>{s+=G.hs[i]*(T[i].h||0)/2;if(!G.mort[i])s+=T[i].mv});return s}

/* ----- tiền ----- */
function settle(pid,amt,to){const p=G.players[pid];p.money-=amt;
 if(to>=0)G.players[to].money+=amt;
 else if(to===-2){const os=G.players.filter(q=>!q.out&&q.id!==pid);const per=amt/os.length;os.forEach(q=>q.money+=per)}}
function owe(pid,amt,to,why,cont){const p=G.players[pid];if(amt<=0)return true;
 if(p.money>=amt){settle(pid,amt,to);fl(p.pos,'-$'+amt,'bad');snd('pay');
  if(to>=0){fl(G.players[to].pos,'+$'+amt,'good');if(amt>=80){botEmote(pid,rnd(2)?2:1);botEmote(to,0);if(amt>=150&&Math.random()<.35)botThrow(to,pid)}}return true}
 G.debt={pid,amt,to,why:why||'',cont:cont||null};G.phase='debt';
 log(pid,`${p.name} nợ $${amt} (${why||'khoản phải trả'}) nhưng không đủ tiền mặt!`);snd('alarm');return false}

/* ----- di chuyển ----- */
function advance(p,n){const from=p.pos;p.pos=(from+n)%40;fx({k:'walk',pid:p.id,from,n});
 if(from+n>=40){p.money+=200;log(p.id,`${p.name} qua ô BẮT ĐẦU, nhận $200`);fl(0,'+$200','good');snd('coin')}}
function moveTo(p,idx){advance(p,(idx-p.pos+40)%40)}
function sendJail(p){p.pos=10;p.jail=true;p.jt=0;G.dbl=false;G.doubles=0;
 fx({k:'jump',pid:p.id,to:10});fx({k:'shake'});fl(10,'VÀO TÙ!','bad');snd('jail');botEmote(p.id,rnd(2)?1:2);log(p.id,`${p.name} bị tống vào tù!`)}
function moveAndLand(p,n){G.phase='landing';advance(p,n);land(p,n)}

function land(p,ds,opt){const t=T[p.pos];
 switch(t.t){
  case 'gojail':sendJail(p);break;
  case 'tax':log(p.id,`${p.name} nộp ${t.n} $${t.amt}`);fx({k:'flash',tile:p.pos});owe(p.id,t.amt,-1,t.n);break;
  case 'chance':draw('ch',p);break;
  case 'chest':draw('cc',p);break;
  case 'st':case 'rr':case 'util':{
   const o=G.own[p.pos];
   if(o<0){G.phase='buy';break}
   if(o===p.id){if(t.t==='st'&&canBuild(p.pos,p.id))G.phase='upgrade';break}
   if(G.mort[p.pos])break;
   const r=rentOf(p.pos,ds,opt);
   log(p.id,`${p.name} trả $${r} tiền thuê ${t.n} cho ${G.players[o].name}`);
   owe(p.id,r,o,'Tiền thuê '+t.n);break}
  case 'go':fx({k:'flash',tile:0});break;
  default:break}
 if(G.phase==='landing')endAction()}

function endAction(){if(G.winner>=0)return;const p=cp();
 if(p.out){nextTurn();return}
 G.phase=(G.dbl&&!p.jail)?'roll':'end'}
function nextTurn(){let n=G.cur;do{n=(n+1)%G.players.length}while(G.players[n].out);
 G.cur=n;G.doubles=0;G.dbl=false;G.phase='roll';G.turnNo++;log(n,`— Lượt của ${G.players[n].name} —`)}
function checkWin(){const al=G.players.filter(p=>!p.out);
 if(al.length===1&&G.players.length>1){G.winner=al[0].id;G.phase='over';fx({k:'win',pid:G.winner});log(G.winner,`${al[0].name} CHIẾN THẮNG!`);return true}return false}

/* ----- thẻ bài ----- */
function draw(dk,p){const ci=G.deck[dk].shift();const c=(dk==='ch'?CH:CC)[ci];
 fx({k:'card',dk,ci,pid:p.id});if(c.f==='bad')botEmote(p.id,4);else if(c.f==='good')botEmote(p.id,3);log(p.id,`${p.name} rút thẻ ${dk==='ch'?'Cơ Hội':'Khí Vận'}: ${c.x}`);
 if(c.e==='free'){p.fc.push({dk,ci})}else G.deck[dk].push(ci);
 applyCard(p,c)}
function applyCard(p,c){
 switch(c.e){
  case 'm':if(c.v>0){p.money+=c.v;fl(p.pos,'+$'+c.v,'good');snd('coin')}else owe(p.id,-c.v,-1,'Thẻ bài');break;
  case 'go':moveTo(p,c.to);G.phase='landing';land(p,G.last.d1+G.last.d2);break;
  case 'near':{let idx=p.pos;for(let k=1;k<40;k++){const j=(p.pos+k)%40;if(T[j].t===(c.of==='rr'?'rr':'util')){idx=j;break}}
   moveTo(p,idx);G.phase='landing';
   const ds=rd()+rd();
   land(p,ds,{double:c.of==='rr',ten:c.of==='util'});break}
  case 'back':p.pos=(p.pos+37)%40;fx({k:'jump',pid:p.id,to:p.pos});G.phase='landing';land(p,G.last.d1+G.last.d2);break;
  case 'jail':sendJail(p);break;
  case 'free':fl(p.pos,'Thẻ ra tù!','good');snd('coin');break;
  case 'rep':{let n=0;owned(p.id).forEach(i=>{const h=G.hs[i];n+=h===5?c.H:h*c.h});if(n>0)owe(p.id,n,-1,'Sửa chữa nhà cửa');else log(p.id,'Không có nhà để sửa — không mất gì.');break}
  case 'each':{const os=G.players.filter(q=>!q.out&&q.id!==p.id);owe(p.id,-c.v*os.length,-2,'Trả mỗi người');break}
  case 'eachget':{G.players.filter(q=>!q.out&&q.id!==p.id).forEach(q=>{const v=Math.min(q.money,c.v);q.money-=v;p.money+=v});fl(p.pos,'+quà','good');snd('coin');break}}}

/* ----- xúc xắc & tù ----- */
function doRoll(){const p=cp();const d1=rd(),d2=rd();G.last={id:++G.rollId,d1,d2};fx({k:'dice',d1,d2});
 const dbl=d1===d2;log(p.id,`${p.name} tung ${d1} + ${d2} = ${d1+d2}${dbl?' (đôi!)':''}`);
 if(p.jail){
  if(dbl){p.jail=false;p.jt=0;G.dbl=false;log(p.id,`${p.name} ra tù nhờ xúc xắc đôi`);moveAndLand(p,d1+d2)}
  else{p.jt++;
   if(p.jt>=3){log(p.id,`${p.name} hết 3 lượt, nộp phạt $50`);G.phase='landing';
    if(owe(p.id,50,-1,'Tiền phạt tù',{k:'jailmove',n:d1+d2})){p.jail=false;p.jt=0;moveAndLand(p,d1+d2)}}
   else{log(p.id,`${p.name} vẫn ở trong tù (lần ${p.jt}/3)`);G.phase='end'}}
  return}
 G.dbl=dbl;
 if(dbl){G.doubles++;if(G.doubles>=3){log(p.id,`${p.name} ra đôi 3 lần liên tiếp!`);sendJail(p);G.phase='end';return}}
 moveAndLand(p,d1+d2)}

/* ----- tài sản ----- */
function canBuild(i,pid){const t=T[i];if(!t||t.t!=='st'||G.own[i]!==pid)return false;
 if(G.mort[i])return false;const h=G.hs[i];if(h>=5)return false;
 if(h===4?G.bank.H<=0:G.bank.h<=0)return false;return G.players[pid].money>=t.h}
function doBuild(i){const t=T[i],p=G.players[G.own[i]];p.money-=t.h;
 if(G.hs[i]===4){G.bank.h+=4;G.bank.H--}else G.bank.h--;G.hs[i]++;
 log(p.id,`${p.name} xây ${G.hs[i]===5?'khách sạn':'nhà'} tại ${t.n}`);fl(i,G.hs[i]===5?'Khách sạn!':'+Nhà','good');fx({k:'flash',tile:i});snd('build');botEmote(p.id,5)}
function canSell(i,pid){const t=T[i];if(!t||t.t!=='st'||G.own[i]!==pid)return false;const h=G.hs[i];if(h<=0)return false;
 if(h===5&&G.bank.h<4)return false;return true}
function doSell(i){const t=T[i],p=G.players[G.own[i]];p.money+=t.h/2;
 if(G.hs[i]===5){G.bank.H++;G.bank.h-=4}else G.bank.h++;G.hs[i]--;
 log(p.id,`${p.name} bán nhà tại ${t.n} (+$${t.h/2})`);fl(i,'+$'+t.h/2,'good');snd('coin')}
function canMort(i,pid){const t=T[i];if(!t||!t.price||G.own[i]!==pid||G.mort[i])return false;
 if(t.t==='st'&&G.hs[i]>0)return false;return true}
const unmortCost=i=>Math.round(T[i].mv*1.1);
function canUnmort(i,pid){return !!T[i].price&&G.own[i]===pid&&G.mort[i]&&G.players[pid].money>=unmortCost(i)}

/* ----- đấu giá ----- */
function startAuction(i){const n=G.players.length,order=[];
 for(let k=1;k<=n;k++){const q=G.players[(G.cur+k)%n];if(!q.out)order.push(q.id)}
 G.auction={idx:i,bid:0,who:-1,order,i:0,passed:[]};G.phase='auction';
 log(G.cur,`Đấu giá ${T[i].n}!`);snd('bell')}
function advanceAuction(){const au=G.auction;const active=au.order.filter(id=>!au.passed.includes(id));
 if(active.length===0||(au.who>=0&&active.length===1)){finishAuction();return}
 let k=au.i;
 for(let s=0;s<au.order.length;s++){k=(k+1)%au.order.length;const id=au.order[k];
  if(!au.passed.includes(id)&&id!==au.who){au.i=k;return}}
 finishAuction()}
function finishAuction(){const au=G.auction;
 if(au.who>=0){const w=G.players[au.who];w.money-=au.bid;G.own[au.idx]=au.who;
  log(w.id,`${w.name} thắng đấu giá ${T[au.idx].n} với $${au.bid}`);fl(au.idx,'Đã bán $'+au.bid,'gold');snd('buy')}
 else log(-1,`Không ai mua ${T[au.idx].n}`);
 G.auction=null;endAction()}

/* ----- phá sản ----- */
function doBankrupt(p){const d=G.debt;const cr=d&&d.to>=0?d.to:-1;
 owned(p.id).forEach(i=>{const h=G.hs[i];if(h>0){p.money+=h*T[i].h/2;if(h===5){G.bank.H++}else G.bank.h+=h;G.hs[i]=0}});
 if(cr>=0){const c=G.players[cr];c.money+=Math.max(0,p.money);
  owned(p.id).forEach(i=>{G.own[i]=cr;if(G.mort[i]){const fee=Math.round(T[i].mv*.1);if(c.money>=fee)c.money-=fee}});
  p.fc.forEach(f=>c.fc.push(f))}
 else{owned(p.id).forEach(i=>{G.own[i]=-1;G.mort[i]=false});p.fc.forEach(f=>G.deck[f.dk].push(f.ci))}
 p.fc=[];p.money=0;p.out=true;p.jail=false;G.debt=null;
 log(p.id,`${p.name} PHÁ SẢN và bị loại!`);fx({k:'shake'});snd('jail');
 if(!checkWin()){if(G.cur===p.id)nextTurn()}}

/* ----- giao dịch ----- */
function tradeValid(tr){const a=G.players[tr.from],b=G.players[tr.to];if(!a||!b||a.out||b.out||tr.from===tr.to)return false;
 const side=(src,it)=>{if(it.cash<0||it.cash>src.money||it.fc<0||it.fc>src.fc.length)return false;
  return it.props.every(i=>G.own[i]===src.id&&T[i].price&&(T[i].t!=='st'||GRP[T[i].g].every(k=>G.hs[k]===0)))};
 return side(a,tr.o)&&side(b,tr.w)&&(tr.o.cash+tr.o.fc+tr.o.props.length+tr.w.cash+tr.w.fc+tr.w.props.length>0)}
function execTrade(tr){const a=G.players[tr.from],b=G.players[tr.to];
 const mv=(src,dst,it)=>{src.money-=it.cash;dst.money+=it.cash;
  it.props.forEach(i=>{G.own[i]=dst.id;if(G.mort[i]){const f=Math.round(T[i].mv*.1);if(dst.money>=f)dst.money-=f}});
  for(let k=0;k<it.fc;k++)dst.fc.push(src.fc.shift())};
 mv(a,b,tr.o);mv(b,a,tr.w);
 log(a.id,`${a.name} và ${b.name} giao dịch thành công!`);snd('buy');fl(a.pos,'Giao dịch!','gold')}

/* ----- điều phối hành động ----- */
function act(pid,a,x){
 if(!G||G.winner>=0)return false;const p=G.players[pid];if(!p||p.out)return false;let ok=false;
 const mine=G.cur===pid,ph=G.phase;
 if(G.trade&&a!=='tradeResp'&&a!=='tradeCancel'&&a!=='emote'&&a!=='throw'&&a!=='interact')return false;
 switch(a){
  case 'emote':if(Number.isInteger(x)&&x>=0&&x<EMO.length&&Date.now()-(p.et||0)>700){p.et=Date.now();fx({k:'emote',pid,e:x});ok=true}break;
  case 'throw':if(x&&Number.isInteger(x.i)&&x.i>=0&&x.i<THR.length){const t=G.players[x.to];if(t&&!t.out&&x.to!==pid&&Date.now()-(p.tt||0)>1200){p.tt=Date.now();fx({k:'throw',from:pid,to:x.to,i:x.i});log(pid,`${p.name} ném ${THR[x.i].v} vào ${t.name}`);if(t.bot&&!p.bot&&Math.random()<.6)botThrow(t.id,pid,1);ok=true}}break;
  case 'interact':if(x&&['hugF','hugB','kiss'].includes(x.kind)){const A=G.players[x.a],B=G.players[x.b];if(A&&B&&!A.out&&!B.out&&x.a!==x.b&&Date.now()-(G.itT||0)>2000){G.itT=Date.now();fx({k:'interact',a:x.a,b:x.b,kind:x.kind});ok=true}}break;
  case 'roll':if(mine&&ph==='roll'){doRoll();ok=true}break;
  case 'jpay':if(mine&&ph==='roll'&&p.jail&&p.money>=50){p.money-=50;p.jail=false;p.jt=0;log(pid,`${p.name} nộp $50 để ra tù`);fl(p.pos,'-$50','bad');snd('pay');ok=true}break;
  case 'jcard':if(mine&&ph==='roll'&&p.jail&&p.fc.length){const f=p.fc.shift();G.deck[f.dk].push(f.ci);p.jail=false;p.jt=0;log(pid,`${p.name} dùng thẻ Ra Tù Miễn Phí`);fl(p.pos,'Tự do!','good');snd('coin');ok=true}break;
  case 'buy':if(mine&&ph==='buy'){const t=T[p.pos];if(p.money>=t.price){p.money-=t.price;G.own[p.pos]=pid;log(pid,`${p.name} mua ${t.n} giá $${t.price}`);fl(p.pos,'-$'+t.price,'gold');snd('buy');fx({k:'flash',tile:p.pos});botEmote(pid,3);endAction();ok=true}}break;
  case 'upBuild':if(mine&&ph==='upgrade'){if(canBuild(p.pos,pid))doBuild(p.pos);endAction();ok=true}break;
  case 'upSkip':if(mine&&ph==='upgrade'){endAction();ok=true}break;
  case 'noBuy':if(mine&&ph==='buy'){startAuction(p.pos);ok=true}break;
  case 'bid':{const au=G.auction;if(ph==='auction'&&au&&au.order[au.i]===pid&&Number.isFinite(x)&&x>au.bid&&x<=p.money){au.bid=Math.floor(x);au.who=pid;log(pid,`${p.name} trả $${au.bid}`);snd('tick');advanceAuction();ok=true}break}
  case 'pass':{const au=G.auction;if(ph==='auction'&&au&&au.order[au.i]===pid){au.passed.push(pid);log(pid,`${p.name} bỏ qua`);advanceAuction();ok=true}break}
  case 'end':if(mine&&ph==='end'){nextTurn();ok=true}break;
  case 'build':if(mine&&(ph==='roll'||ph==='end'||ph==='upgrade')&&canBuild(x,pid)){doBuild(x);ok=true}break;
  case 'sell':if(mine&&(ph==='roll'||ph==='end'||ph==='debt')&&canSell(x,pid)){doSell(x);ok=true}break;
  case 'mort':if(mine&&(ph==='roll'||ph==='end'||ph==='debt')&&canMort(x,pid)){G.mort[x]=true;p.money+=T[x].mv;log(pid,`${p.name} thế chấp ${T[x].n} (+$${T[x].mv})`);fl(x,'+$'+T[x].mv,'good');snd('coin');ok=true}break;
  case 'unmort':if(mine&&(ph==='roll'||ph==='end')&&canUnmort(x,pid)){const c=unmortCost(x);p.money-=c;G.mort[x]=false;log(pid,`${p.name} chuộc ${T[x].n} (-$${c})`);fl(x,'-$'+c,'bad');snd('pay');ok=true}break;
  case 'payDebt':if(mine&&ph==='debt'&&G.debt&&G.debt.pid===pid&&p.money>=G.debt.amt){const d=G.debt;settle(pid,d.amt,d.to);fl(p.pos,'-$'+d.amt,'bad');snd('pay');G.debt=null;
   if(d.cont&&d.cont.k==='jailmove'){p.jail=false;p.jt=0;moveAndLand(p,d.cont.n)}else endAction();ok=true}break;
  case 'bankrupt':if(mine&&ph==='debt'&&G.debt&&liquid(p)<G.debt.amt){doBankrupt(p);ok=true}break;
  case 'trade':if(mine&&(ph==='roll'||ph==='end')&&x){const tr={from:pid,to:x.to,o:x.o,w:x.w};if(tradeValid(tr)){G.trade=tr;log(pid,`${p.name} đề nghị giao dịch với ${G.players[tr.to].name}`);snd('bell');ok=true}}break;
  case 'tradeResp':if(G.trade&&G.trade.to===pid){const tr=G.trade;G.trade=null;
   if(x&&tradeValid(tr))execTrade(tr);else{log(pid,`${p.name} từ chối giao dịch`);snd('pay')}ok=true}break;
  case 'tradeCancel':if(G.trade&&G.trade.from===pid){G.trade=null;ok=true}break}
 if(ok)hookSync();return ok}

/* ================= BOT AI ================= */
const unownedCount=()=>T.filter(t=>t.price&&G.own[t.i]<0).length;
function botValue(b,i){const t=T[i];let v=t.price*[0,.7,.95,1.15][b.bot];
 if(t.g){const others=GRP[t.g].filter(k=>k!==i);
  if(others.every(k=>G.own[k]===b.id))v*=1.6;
  else if(b.bot>=3&&others.every(k=>G.own[k]>=0&&G.own[k]===G.own[others[0]]&&G.own[k]!==b.id))v*=1.25;
  else if(others.some(k=>G.own[k]===b.id))v*=1.1}
 if(t.t==='rr')v*=1+0.15*RRS.filter(k=>G.own[k]===b.id).length;
 return v}
function botBuy(p){const t=T[p.pos],left=p.money-t.price;if(left<0)return false;
 const completes=t.g&&GRP[t.g].filter(k=>k!==p.pos).every(k=>G.own[k]===p.id);
 if(completes)return true;
 if(p.bot===1)return left>=150&&Math.random()<.65;
 if(p.bot===2)return left>=120;
 return left>=40||t.t==='rr'}
function botAuction(b){const au=G.auction,t=T[au.idx];
 const maxb=Math.min(botValue(b,au.idx),b.money-[0,60,50,20][b.bot]);
 const inc=Math.max(10,Math.round(t.price*.06/10)*10);
 const nb=au.bid===0?Math.max(10,Math.round(t.price*.25/10)*10):au.bid+inc;
 if(nb<=maxb&&au.who!==b.id&&!(b.bot===1&&Math.random()<.15))act(b.id,'bid',nb);else act(b.id,'pass')}
function botManage(p){const reserve=[0,350,220,130][p.bot];
 if(p.money>reserve+300){for(const i of owned(p.id))if(G.mort[i]){const c=unmortCost(i);if(p.money-c>=reserve+150){return act(p.id,'unmort',i)}}}
 if(p.bot===1&&Math.random()<.6)return false;
 let best=-1,bs=-1;
 for(const i of owned(p.id))if(canBuild(i,p.id)&&p.money-T[i].h>=reserve){const s=T[i].rent[Math.min(5,G.hs[i]+1)]/T[i].h;if(s>bs){bs=s;best=i}}
 if(best>=0)return act(p.id,'build',best);
 return false}
function botJail(p){
 if(p.fc.length){act(p.id,'jcard');return}
 if(p.bot>=2&&p.money>=250&&unownedCount()>=8){act(p.id,'jpay');return}
 if(p.bot===1&&p.money>=600){act(p.id,'jpay');return}
 act(p.id,'roll')}
function raiseCash(p){
 const inSet=i=>{const t=T[i];return t.t==='st'&&ownsAll(p.id,t.g)};
 let c=owned(p.id).filter(i=>canMort(i,p.id)&&!inSet(i)).sort((a,b)=>T[a].mv-T[b].mv);
 if(c.length)return act(p.id,'mort',c[0]);
 c=owned(p.id).filter(i=>canSell(i,p.id)).sort((a,b)=>G.hs[b]-G.hs[a]);
 if(c.length)return act(p.id,'sell',c[0]);
 c=owned(p.id).filter(i=>canMort(i,p.id)).sort((a,b)=>T[a].mv-T[b].mv);
 if(c.length)return act(p.id,'mort',c[0]);
 return false}
function botTradeEval(b,tr){
 const val=(i,toId)=>{const t=T[i];let v=t.price;if(G.mort[i])v*=.7;
  if(t.g){const others=GRP[t.g].filter(k=>k!==i);if(others.every(k=>G.own[k]===toId))v*=1.9;else if(others.some(k=>G.own[k]===toId))v*=1.15}return v};
 const got=tr.o.cash+tr.o.props.reduce((s,i)=>s+val(i,b.id),0)+tr.o.fc*50;
 let gave=tr.w.cash+tr.w.props.reduce((s,i)=>s+Math.max(val(i,tr.from),val(i,b.id)),0)+tr.w.fc*50;
 return got>=gave*[0,1.35,1.15,1.05][b.bot]+10}
function botTradeIdea(p){
 if(p.bot<2||G.tradeTry===G.turnNo||G.turnNo%3)return false;G.tradeTry=G.turnNo;
 for(const g in GRP){const tl=GRP[g];const mine=tl.filter(i=>G.own[i]===p.id);const miss=tl.filter(i=>G.own[i]!==p.id);
  if(mine.length===tl.length-1&&miss.length===1){const i=miss[0],o=G.own[i];
   if(o>=0&&!G.players[o].out&&tl.every(k=>G.hs[k]===0)){const price=Math.round(T[i].price*2.6/10)*10;
    if(p.money-price>=100)return act(p.id,'trade',{to:o,o:{cash:price,props:[],fc:0},w:{cash:0,props:[i],fc:0}})}}}
 return false}
function botStep(){
 if(!G||G.winner>=0)return false;
 if(G.trade){const b=G.players[G.trade.to];if(b.bot){act(b.id,'tradeResp',botTradeEval(b,G.trade));return true}return false}
 if(G.phase==='auction'){const au=G.auction,b=G.players[au.order[au.i]];if(b.bot){botAuction(b);return true}return false}
 const p=cp();if(!p.bot)return false;
 switch(G.phase){
  case 'roll':if(botManage(p))return true;if(p.jail){botJail(p);return true}if(botTradeIdea(p))return true;act(p.id,'roll');return true;
  case 'buy':act(p.id,botBuy(p)?'buy':'noBuy');return true;
  case 'upgrade':act(p.id,(canBuild(p.pos,p.id)&&p.money-T[p.pos].h>=[0,350,220,130][p.bot]&&!(p.bot===1&&Math.random()<.4))?'upBuild':'upSkip');return true;
  case 'debt':if(p.money>=G.debt.amt)act(p.id,'payDebt');else if(!raiseCash(p))act(p.id,'bankrupt');return true;
  case 'end':if(botManage(p))return true;act(p.id,'end');return true}
 return false}

/* Storage an toàn: Safari iOS có thể chặn localStorage/sessionStorage (iframe, chế độ riêng tư, hết dung lượng).
   Mọi truy cập đều bọc try...catch và luôn có bản dự phòng trên RAM (MEM) để game vẫn chạy trong phiên hiện tại. */
const MEM_L={},MEM_S={};
function mkStore(kind,mem){
 const raw=()=>{try{return window[kind]}catch(e){return null}};
 return{
  get(k,d){let s=null;
   if(Object.prototype.hasOwnProperty.call(mem,k))s=mem[k];
   else{try{const st=raw();if(st)s=st.getItem(k)}catch(e){}}
   if(s==null)return d;try{return JSON.parse(s)}catch(e){return d}},
  set(k,v){let s;try{s=JSON.stringify(v)}catch(e){return}if(s===undefined)return;mem[k]=s;try{const st=raw();if(st)st.setItem(k,s)}catch(e){}},
  del(k){delete mem[k];try{const st=raw();if(st)st.removeItem(k)}catch(e){}}}}
const LS=mkStore('localStorage',MEM_L),SS=mkStore('sessionStorage',MEM_S);

const BG={cv:null,cx:null,st:[],w:0,h:0,t:0,
 init(){this.cv=$('#bg');this.cx=this.cv.getContext('2d');this.size();addEventListener('resize',()=>this.size());
  const n=120;for(let i=0;i<n;i++)this.st.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.4,s:Math.random()*.00006+.00002,p:Math.random()*6.28,c:['#ff8fc4','#a98bff','#6bbcf5','#ffb938','#ff7eb6','#7be0c8'][rnd(6)]});
  this.reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;this.loop()},
 size(){const d=Math.min(devicePixelRatio||1,2);this.w=innerWidth;this.h=innerHeight;this.cv.width=this.w*d;this.cv.height=this.h*d;this.cx.setTransform(d,0,0,d,0,0)},
 loop(){const c=this.cx;c.clearRect(0,0,this.w,this.h);this.t++;
  for(const s of this.st){if(!this.reduce){s.y-=s.s*16;s.x+=s.s*5;if(s.y<-.02)s.y=1.02;if(s.x>1.02)s.x=-.02}
   const a=.35+.65*Math.abs(Math.sin(this.t*.02+s.p));c.globalAlpha=a;c.fillStyle=s.c;c.beginPath();c.arc(s.x*this.w,s.y*this.h,s.r,0,6.283);c.fill();
   if(s.r>1.5){c.strokeStyle=s.c;c.lineWidth=.6;c.beginPath();c.moveTo(s.x*this.w-s.r*3,s.y*this.h);c.lineTo(s.x*this.w+s.r*3,s.y*this.h);c.moveTo(s.x*this.w,s.y*this.h-s.r*3);c.lineTo(s.x*this.w,s.y*this.h+s.r*3);c.stroke()}}
  c.globalAlpha=1;if(!document.hidden)requestAnimationFrame(()=>this.loop());else setTimeout(()=>this.loop(),500)}};

const FX={cv:null,cx:null,P:[],on:false,timers:[],
 init(){this.cv=$('#fxcv');this.cx=this.cv.getContext('2d');this.size();addEventListener('resize',()=>this.size())},
 size(){const d=Math.min(devicePixelRatio||1,2);this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.cx.setTransform(d,0,0,d,0,0)},
 confetti(x,y,n,spread,up){const cols=['#ff6b8b','#ffd166','#72e6c4','#7cc4ff','#b9a7ff','#fff'];
  for(let i=0;i<n;i++){const a=(up?-Math.PI/2:Math.random()*6.283)+(Math.random()-.5)*spread;const v=4+Math.random()*9;
   this.P.push({k:'c',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.16,l:0,m:110+rnd(70),c:cols[rnd(6)],w:5+rnd(6),h:3+rnd(5),r:Math.random()*6,vr:(Math.random()-.5)*.4})}this.go()},
 rain(n){for(let i=0;i<n;i++)this.P.push({k:'c',x:Math.random()*innerWidth,y:-20-Math.random()*80,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.03,l:0,m:260,c:['#ff6b8b','#ffd166','#72e6c4','#7cc4ff','#b9a7ff','#fff'][rnd(6)],w:6+rnd(6),h:4+rnd(5),r:Math.random()*6,vr:(Math.random()-.5)*.3});this.go()},
 burst(x,y){const hue=rnd(360),n=70+rnd(30);for(let i=0;i<n;i++){const a=i/n*6.283,v=2+Math.random()*5.5;
   this.P.push({k:'f',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,l:0,m:60+rnd(30),c:`hsl(${hue+rnd(40)},100%,${60+rnd(20)}%)`,s:2+Math.random()*1.5})}
  for(let i=0;i<20;i++)this.P.push({k:'f',x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,g:.02,l:0,m:30,c:'#fff',s:2.4});AUD.play('boom');this.go()},
 celebrate(){this.stop();let n=0;const t=setInterval(()=>{this.burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4));this.rain(14);if(++n>=18)clearInterval(t)},420);this.timers.push(t);this.confetti(innerWidth*.2,innerHeight,90,.9,true);this.confetti(innerWidth*.8,innerHeight,90,.9,true)},
 stop(){this.timers.forEach(clearInterval);this.timers=[]},
 go(){if(this.on)return;this.on=true;const step=()=>{const c=this.cx;c.clearRect(0,0,innerWidth,innerHeight);
   this.P=this.P.filter(p=>p.l<p.m&&p.y<innerHeight+40);
   for(const p of this.P){p.l++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=p.k==='f'?.985:.995;const a=Math.max(0,1-p.l/p.m);c.globalAlpha=p.k==='f'?a:Math.min(1,a*2);
    if(p.k==='f'){c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s*a+.4,0,6.283);c.fill()}
    else{p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,Math.cos(p.r*2));c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}}
   c.globalAlpha=1;if(this.P.length||this.timers.length)requestAnimationFrame(step);else{this.on=false;c.clearRect(0,0,innerWidth,innerHeight)}};requestAnimationFrame(step)}};

 try{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(trTree);else if(m.type==='characterData')trNode(m.target);else if(m.type==='attributes')trAttrs(m.target)}}finally{moObs()}});
const moObs=()=>MO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TATTR});
function setLang(l){if(l===LANG)return;LANG=l;LS.set('dcts_lang',l);MO.disconnect();document.documentElement.lang=l;
 trTree(document.body);document.title=L('Địa Chủ Tập Sự','Landlord Apprentice');if(l==='en')moObs();
 $$('[data-a=langToggle]').forEach(b=>b.innerHTML=langLabel());if(MD)renderModal()}
function initLang(){document.documentElement.lang=LANG;if(LANG==='en'){trTree(document.body);document.title='Landlord Apprentice';moObs()}}

const DR={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function setDice(a,b,instant){[a,b].forEach((v,k)=>{const c=$(`#dw${k} .cube`);if(!c)return;const[x,y]=DR[v];if(instant){c.style.transition='none';c.style.transform=`rotateX(${x}deg) rotateY(${y}deg)`}})}
let DICE_RUN=0;
function simDie(k){const g=60,dt=1/120;
 let x=-12+Math.random()*3,y=6+Math.random()*5,z=10+Math.random()*2,vx=9+Math.random()*5,vy=-(6+Math.random()*5),vz=11+Math.random()*4;
 const tr=[],hits=[];let t=0,n=0,rest=false;
 while(t<3&&!rest){vz-=g*dt;z+=vz*dt;x+=vx*dt;y+=vy*dt;
  const fl=2.9+1.3*Math.exp(-t*2.2);
  if(z<fl){const iv=-vz;z=fl;if(iv>3.2){vz=iv*.52;vx*=.78;vy*=.78;hits.push({t,v:iv});n++}else{vz=0;if(n>=3)rest=true}}
  tr.push([x,y,z]);t+=dt}
 const T=Math.min(3,t)+.1,e=tr[tr.length-1];
 const sp=()=>(Math.random()<.5?-1:1)*360*(2+rnd(2));
 return {tr,hits,T,ex:e[0],ey:e[1],S:[sp(),sp(),sp()],yaw:90*rnd(4),idx:0}}
function animDice(a,b){return new Promise(res=>{const my=++DICE_RUN;AUD.play('whoosh');
 const sp=[a,b].map((v,k)=>Object.assign(simDie(k),{k,v,delay:k*.09}));
 const TT=Math.max(...sp.map(s=>s.T+s.delay));let done=false;
 const fin=()=>{if(done)return;done=true;
  sp.forEach(s=>{const w=$('#dw'+s.k),c=w.querySelector('.cube'),sh=$('#dsh'+s.k),[x,y]=DR[s.v];
   c.style.transition='none';c.style.setProperty('--bl','0px');c.style.transform=`rotateZ(${s.yaw}deg) rotateX(${x}deg) rotateY(${y}deg)`;
   w.style.transform='translate3d(0,0,2.9em)';sh.style.transform='';sh.style.opacity='';sh.style.filter=''});
  if(DICE_RUN===my)res();else res()};
 const draw=(s,el)=>{const t=Math.max(0,Math.min(el,s.T)),u=t/s.T,i=Math.min(s.tr.length-1,Math.floor(t*120)),q=s.tr[i];
  const cs=u*u,x=q[0]-s.ex*cs,y=q[1]-s.ey*cs,z=u>=1?2.9:q[2],h=Math.max(0,z-2.9);
  const p=1-Math.pow(1-u,2.4),rem=1-p,[tx,ty]=DR[s.v];
  let kx=0,ky=0;for(const hh of s.hits){const d=t-hh.t;if(d>=0&&d<.5){const am=Math.min(14,hh.v*.5)*Math.exp(-d*9);kx+=am*Math.sin(d*42);ky+=am*Math.cos(d*37)}}
  const w=$('#dw'+s.k),c=w.querySelector('.cube'),sh=$('#dsh'+s.k);
  c.style.transition='none';
  c.style.transform=`rotateZ(${s.yaw+s.S[2]*rem}deg) rotateX(${tx+s.S[0]*rem+kx}deg) rotateY(${ty+s.S[1]*rem+ky}deg)`;
  w.style.transform=`translate3d(${x}em,${y}em,${z}em)`;
  const nx=s.tr[Math.min(s.tr.length-1,i+6)],lin=Math.hypot(nx[0]-q[0],nx[1]-q[1],nx[2]-q[2])*20;
  const om=Math.hypot(s.S[0],s.S[1],s.S[2])*2.4*Math.pow(1-u,1.4)/s.T;
  const bl=Math.min(3.2,om/700+lin*.02);c.style.setProperty('--bl',(bl>.25?bl.toFixed(2):0)+'px');
  sh.style.transform=`translate(${(x+h*.2).toFixed(2)}em,${(y+h*.32).toFixed(2)}em) rotate(${s.yaw}deg) scale(${(1+h*.045).toFixed(3)})`;
  sh.style.opacity=(.95/(1+h*.24)).toFixed(3);sh.style.filter=`blur(${(.35+h*.07).toFixed(2)}em)`;
  while(s.idx<s.hits.length&&t>=s.hits[s.idx].t){AUD.clack(s.hits[s.idx].v/30);s.idx++}};
 const T0=performance.now();
 const frame=now=>{if(done||DICE_RUN!==my)return;const el=(now-T0)/1000;sp.forEach(s=>draw(s,el-s.delay));if(el<TT)requestAnimationFrame(frame);else fin()};
 sp.forEach(s=>draw(s,0));requestAnimationFrame(frame);setTimeout(fin,TT*1000+300)})}

 {const[ax,ay]=pos(ta),[bx,by]=pos(tb);var sg=((bx-ax)*hx+(by-ay)*hy)>=0?1:-1}   /* sg=1: A đứng bên trái màn hình */

 turn:[{urls:['turn:global.relay.metered.ca:80','turn:global.relay.metered.ca:80?transport=tcp','turn:global.relay.metered.ca:443','turns:global.relay.metered.ca:443?transport=tcp'],username:'040eb74c8bc6cf8cbd7b5af7',credential:'sdrd1ZjilwZSg98e'}],
 iceUrl:'', /* tuỳ chọn: URL trả JSON iceServers (TURN có thời hạn); lỗi/timeout thì dùng danh sách tĩnh ở trên */

};

const iceList=extra=>[{urls:NET_CONF.stun}].concat(extra||[],NET_CONF.turn.filter(t=>t&&t.urls),NET_CONF.legacyTurn?[LEGACY_TURN]:[]);
const PEER_OPTS={debug:0,host:SIG.host,port:SIG.port,path:SIG.path,key:SIG.key,secure:true,pingInterval:4000,
 config:{iceTransportPolicy:'all',iceCandidatePoolSize:4,iceServers:iceList()}};
let ICE_STAT={host:0,srflx:0,relay:0}; /* kết quả thu thập ICE gần nhất: relay>0 nghĩa là TURN đang chạy */

const newPeer=(id,relay)=>{const o=(relay&&ICE_STAT.relay)?Object.assign({},PEER_OPTS,{config:Object.assign({},PEER_OPTS.config,{iceTransportPolicy:'relay'})}):PEER_OPTS;return id?new Peer(id,o):new Peer(o)};

/* Tải PeerJS: thử nhiều CDN, 2 vòng (iOS hoặc mạng trường học đôi khi chặn một CDN) */
function loadPeer(){
 const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js'].map(secureUrl);
 const one=u=>new Promise((res,rej)=>{const x=document.createElement('script');x.src=u;x.async=true;const t=setTimeout(()=>{x.remove();rej(new Error('timeout'))},9000);x.onload=()=>{clearTimeout(t);res()};x.onerror=()=>{clearTimeout(t);x.remove();rej(new Error('load'))};document.head.appendChild(x)});
 return (async()=>{if(window.Peer)return;
  netMsg(L('Đang tải thư viện kết nối...','Loading connection library...'),'busy');
  for(let round=0;round<2;round++){for(const u of urls){try{await one(u);if(window.Peer)return}catch(e){}}await sleep(500)}
  throw uerr('Không tải được thư viện kết nối (PeerJS). Kiểm tra mạng hoặc tắt trình chặn quảng cáo rồi thử lại.')})()}

/* Chờ thu thập đủ ICE candidates (tối đa ms) trước khi gửi tín hiệu kết nối.
   Chạy một RTCPeerConnection "khởi động" để STUN/TURN được phân giải sẵn; PeerJS sau đó dùng candidate pool đã gom. */
let ICE_WARM=0,ICE_EXP=0;
/* Lấy TURN có thời hạn từ NET_CONF.iceUrl (nếu có). Lỗi/timeout 5s thì bỏ qua. Làm mới sau 30 phút. */
async function loadIce(){if(!NET_CONF.iceUrl||Date.now()<ICE_EXP)return;
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);
  const r=await fetch(NET_CONF.iceUrl,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)return;
  let j=await r.json();if(!Array.isArray(j))j=j&&j.iceServers;j=(j||[]).filter(x=>x&&x.urls);
  if(j.length){PEER_OPTS.config.iceServers=iceList(j);ICE_EXP=Date.now()+30*60000;ICE_WARM=0}}catch(e){}}
function warmIce(ms){return new Promise(res=>{
 if(ICE_WARM||!window.RTCPeerConnection)return res(null);
 let pc=null,fin=false;const got={host:0,srflx:0,relay:0};let to=0;
 const done=()=>{if(fin)return;fin=true;clearTimeout(to);try{pc&&pc.close()}catch(e){}if(got.host||got.srflx||got.relay)ICE_WARM=1;ICE_STAT=got;res(got)};

 try{pc=new RTCPeerConnection(PEER_OPTS.config);pc.createDataChannel('w');
  pc.onicegatheringstatechange=()=>{if(pc&&pc.iceGatheringState==='complete')done()};
  pc.onicecandidate=e=>{if(!e.candidate)return done();const m=/ typ (host|srflx|prflx|relay)/.exec(e.candidate.candidate);if(m)got[m[1]==='prflx'?'srflx':m[1]]++};
  pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(done)}catch(e){done()}})}

/* Giữ kết nối tín hiệu với máy chủ: tự nối lại có lùi dần thời gian (0.8s → 8s), không bỏ cuộc */
function keepPeerAlive(peer,net){let k=0;
 peer.on('open',()=>{k=0});
 peer.on('disconnected',()=>{if(ST.net!==net||peer.destroyed)return;
  netMsg(L('Mất kết nối máy chủ, đang nối lại...','Server connection lost, reconnecting...'),'busy');
  const d=Math.min(800*Math.pow(2,k++),8000);
  setTimeout(()=>{if(ST.net===net&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},d)})}

/* Heartbeat trên kênh dữ liệu: gửi ping mỗi 5s; không nhận được gì trong 22s (khi tab đang hiện) thì coi là đứt và đóng để kích hoạt nối lại */
const HB_MS=5000,HB_DEAD=22000;let NET_GRACE=0;
function hbStart(c,onDead){c._last=Date.now();
 const iv=setInterval(()=>{if(!c.open){clearInterval(iv);return}
  try{c.send({t:'ping'})}catch(e){}
  if(!document.hidden&&Date.now()>NET_GRACE&&Date.now()-c._last>HB_DEAD){clearInterval(iv);onDead()}},HB_MS);
 c.on('close',()=>clearInterval(iv))}

/* ----- Chat giọng nói (micro) khi chơi Online -----
   Mỗi người bật micro sẽ gọi âm thanh một chiều (PeerJS MediaConnection) tới mọi người trong phòng; người nhận tự động trả lời và phát.
   Chủ phòng gửi danh sách ID của các khách ({t:'peers'}) để khách gọi được nhau. Cần HTTPS và quyền micro của Safari. */
/* ===== Bộ quản lý Mic dùng chung (Mic phòng của Vẽ Hình Đoán Chữ + Ai Là Gián Điệp + Cờ Tỷ Phú) =====
   Một luồng MediaStream duy nhất, nhiều "chủ sở hữu" (vc / draw). Khi không còn ai dùng, luồng được dừng hẳn để không treo mic.
   Mọi bước đều bọc try/catch; không hỗ trợ micro thì chỉ báo nhẹ nhàng, game vẫn chạy bình thường. */
const MIC=(()=>{
 let stream=null,ac=null,an=null,buf=null,tm=0,pend=null,muted=false,speaking=false,lv=0,hold=0;
 const owners=new Set(),subs=new Map();
 const supported=()=>{try{return !!(navigator.mediaDevices&&typeof navigator.mediaDevices.getUserMedia==='function')}catch(e){return false}};
 const live=()=>{try{return !!(stream&&stream.getAudioTracks().some(t=>t.readyState==='live'))}catch(e){return false}};
 function why(e){const n=e&&e.name;
  if(n==='NotSupportedError')return '🎙️ Trình duyệt hoặc địa chỉ trang này chưa cho dùng micro (cần mở bằng HTTPS, hoặc trang không nằm trong khung nhúng bị hạn chế quyền).';
  if(n==='NotAllowedError'||n==='SecurityError'||n==='PermissionDeniedError')return '🎙️ Bạn chưa cấp quyền micro (hoặc trình duyệt đang chặn). Hãy cho phép Micro cho trang này rồi bấm lại nhé.';
  if(n==='NotFoundError'||n==='DevicesNotFoundError'||n==='OverconstrainedError')return '🎙️ Không tìm thấy micro trên thiết bị này. Bạn cắm tai nghe/micro rồi thử lại nhé.';
  if(n==='NotReadableError'||n==='AbortError'||n==='TrackStartError')return '🎙️ Micro đang được ứng dụng khác sử dụng. Hãy tắt ứng dụng đó rồi thử lại nhé.';
  return '🎙️ Chưa bật được micro lúc này. Bạn thử tải lại trang hoặc dùng Chrome/Safari bản mới nhé.'}
 const emit=o=>{subs.forEach(f=>{try{f(o)}catch(e){}})};
 function meter(){try{if(!an||document.hidden)return;an.getByteTimeDomainData(buf);let t=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;t+=v*v}
  const r=Math.sqrt(t/buf.length),now=Date.now();let sp=!muted&&r>.035;if(sp)hold=now+350;else if(!muted&&now<hold)sp=true;
  const l=sp?Math.min(3,1+Math.floor(r*14)):0;
  if(sp!==speaking||l!==lv){speaking=sp;lv=l;emit({speaking:sp,lv:l})}}catch(e){}}
 function kill(){clearInterval(tm);tm=0;try{ac&&ac.close()}catch(e){}ac=an=null;buf=null;
  try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;muted=false;
  if(speaking||lv){speaking=false;lv=0;emit({speaking:false,lv:0})}}
 async function acquire(owner){
  if(!supported()){const e=new Error('unsupported');e.name='NotSupportedError';throw e}
  if(!live()){
   if(!pend)pend=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}).then(st=>{
    kill();stream=st;muted=false;
    try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();if(ac.resume)ac.resume().catch(()=>{});const src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=256;buf=new Uint8Array(an.fftSize);src.connect(an);tm=setInterval(meter,100)}catch(e){an=null}
    st.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{if(stream===st){owners.clear();kill();emit({ended:true})}}));
    return st}).finally(()=>{pend=null});
   await pend}
  if(!live()){const e=new Error('aborted');e.name='AbortError';throw e}
  owners.add(owner);try{stream.getAudioTracks().forEach(t=>t.enabled=!muted)}catch(e){}return stream}
 function release(owner){owners.delete(owner);if(!owners.size&&!pend)kill()}
 function setMuted(b){muted=!!b;try{stream&&stream.getAudioTracks().forEach(t=>t.enabled=!muted)}catch(e){}if(muted&&(speaking||lv)){speaking=false;lv=0;emit({speaking:false,lv:0})}}
 return{supported,why,acquire,release,setMuted,sub:(k,f)=>subs.set(k,f),state:()=>({live:live(),muted,speaking,lv,owners:[...owners]})}})();
const VC={on:false,stream:null,out:{},aud:{},busy:false,pend:false,talk:false,lv:0};
function voiceTargets(){const n=ST.net;if(!n||n.sim||!n.peer||!n.peer.id)return[];const me=n.peer.id;
 const ids=n.role==='host'?n.conns.filter(c=>c.peer).map(c=>c.peer):[(n.hostId||NET_PREFIX+n.code),...(n.peerIds||[])];
 return [...new Set(ids)].filter(i=>i&&i!==me)}
const callAlive=c=>{const pc=c&&c.peerConnection;if(!pc)return false;const t=pc.iceConnectionState;return t!=='failed'&&t!=='closed'&&t!=='disconnected'};
function voiceSync(){const n=ST.net;if(!VC.on||!VC.stream||!n||!n.peer||n.peer.destroyed||n.peer.disconnected)return;
 const want=voiceTargets();
 want.forEach(id=>{if(callAlive(VC.out[id]))return;
  try{const call=n.peer.call(id,VC.stream);VC.out[id]=call;
   const drop=()=>{if(VC.out[id]===call)delete VC.out[id]};call.on('close',drop);call.on('error',drop)}catch(e){}});
 Object.keys(VC.out).forEach(id=>{if(!want.includes(id)){try{VC.out[id].close()}catch(e){}delete VC.out[id]}})}
function voiceIncoming(net,call,late){if(ST.net!==net){try{call.close()}catch(e){}return}
 if(!voiceTargets().includes(call.peer)&&!late){setTimeout(()=>voiceIncoming(net,call,1),1500);return} /* chờ danh sách ID cập nhật */
 if(!voiceTargets().includes(call.peer)){try{call.close()}catch(e){}return}
 try{call.answer()}catch(e){return}
 call.on('stream',st=>voicePlay(call.peer,st));
 call.on('close',()=>voiceStop(call.peer));call.on('error',()=>voiceStop(call.peer))}
function voicePlay(id,st){voiceStop(id);const a=document.createElement('audio');a.autoplay=true;a.playsInline=true;a.setAttribute('playsinline','');a.srcObject=st;a.style.display='none';document.body.appendChild(a);VC.aud[id]=a;
 try{const r=a.play();if(r&&r.catch)r.catch(()=>{VC.pend=true;toast(L('Chạm màn hình để nghe giọng nói','Tap the screen to hear voice chat'))})}catch(e){}}
function voiceStop(id){const a=VC.aud[id];if(a){try{a.pause();a.srcObject=null;a.remove()}catch(e){}delete VC.aud[id]}}
document.addEventListener('pointerdown',()=>{if(VC.pend){VC.pend=false;Object.values(VC.aud).forEach(a=>{try{a.play()}catch(e){}})}});
function voiceUI(){try{if(ST.net&&ST.net.spy)spyRender();else if(G&&$('#game').classList.contains('on'))renderTop();else if(ST.net&&$('#lobby').classList.contains('on'))renderLobby()}catch(e){}}
function micNote(t,k){const n=ST.net,online=n&&!n.sim;try{if(online&&typeof netMsg==='function')netMsg(t,k);else if(k!=='busy')toast(t)}catch(e){}}
async function voiceOn(){const n=ST.net;if(VC.busy||VC.on)return;
 if(!MIC.supported()){micNote(MIC.why({name:'NotSupportedError'}),'err');return}
 VC.busy=true;voiceUI();
 try{micNote('🎙️ Đang xin quyền micro...','busy');
  const st=await MIC.acquire('vc');
  if(ST.net!==n){MIC.release('vc');return}
  VC.stream=st;VC.on=true;VC.talk=false;VC.lv=0;MIC.setMuted(false);
  micNote(n&&!n.sim?'🎙️ Đã bật mic phòng — mọi người trong phòng sẽ nghe thấy bạn':'🎙️ Đã bật mic (chế độ cục bộ, chưa có người khác trong phòng)','ok');
  voiceSync();micSync()}
 catch(e){try{MIC.release('vc')}catch(x){}micNote(MIC.why(e),'err')}
 finally{VC.busy=false;voiceUI();micPaint()}}
function voiceOff(quiet){const was=VC.on;VC.on=false;VC.talk=false;VC.lv=0;Object.values(VC.out).forEach(c=>{try{c.close()}catch(e){}});VC.out={};VC.stream=null;
 try{MIC.release('vc')}catch(e){}if(was&&!quiet)micNote('🎙️ Đã tắt mic phòng','ok');spkSync();voiceUI();micSync();micPaint()}
function voiceAll(){voiceOff(true);Object.keys(VC.aud).forEach(voiceStop)}
MIC.sub('vc',s=>{if(s.ended){if(VC.on){micNote('🎙️ Micro đã bị ngắt (rút tai nghe hoặc thu hồi quyền).','err');voiceOff(true)}return}
 if(!VC.on)return;VC.talk=!!s.speaking;VC.lv=s.lv||0;micPaint();spkSync()});

/* Đồng bộ trạng thái "đang nói" qua kết nối PeerJS có sẵn: khách báo {t:'spk'} cho chủ phòng, chủ phòng phát {t:'spks'} cho mọi người */
let SPK_LAST=false;
function spkSync(){const n=ST.net,v=!!(VC.on&&VC.talk);if(v===SPK_LAST)return;SPK_LAST=v;if(!n||n.sim)return;
 if(n.role==='host')spkBroadcast();else if(n.conn&&n.conn.open){try{n.conn.send({t:'spk',on:v})}catch(e){}}}
function spkBroadcast(){const n=ST.net;if(!n||n.role!=='host'||n.sim)return;const m={};if(VC.on&&VC.talk)m[0]=1;n.conns.forEach(c=>{if(c.mic&&c.spk&&c.seat!=null)m[c.seat]=1});

function spkOn(id){const n=ST.net,me=SP.V&&SP.V.me?SP.V.me.id:null;

 if(n.role==='host'){const c=n.conns.find(q=>q.seat===id);return !!(c&&c.mic&&c.spk)}

function micPaint(){try{document.querySelectorAll('[data-a="mic"]').forEach(b=>{b.classList.toggle('talk',!!(VC.on&&VC.talk));b.style.setProperty('--lv',VC.lv)});

/* Nối tới phòng: thử tối đa 3 lần khi vào phòng, 8 lần khi tự nối lại; mỗi lần dùng Peer mới.
   recover=true: tự nối lại sau khi bị rớt (trong ván → gửi 'resume', ở phòng chờ → vào lại như mới) */
function guestLink(net,recover){

 const P2P_ERR='Không kết nối được tới phòng '+code+'. Mạng có thể đang chặn kết nối P2P (thử Wi-Fi/4G khác) hoặc chủ phòng đã thoát.';
 const fail=err=>{net.linking=false;if(ST.net!==net)return;
  if(recover){toast(L('Mất kết nối với phòng','Lost connection to the room'));leave()}else netFail(err||uerr(P2P_ERR),code)};
 const attempt=n=>{if(ST.net!==net||net.hostLeft)return;
  net.conn=null;try{net.peer&&net.peer.destroy()}catch(e){}
  const relay=n>=2&&ICE_STAT.relay>0;let peer;try{peer=newPeer(null,relay)}catch(e){return fail(e)}
  net.peer=peer;keepPeerAlive(peer,net);peer.on('call',call=>voiceIncoming(net,call));let done=false,tmo=0,first=true;

   if(n<MAX){netMsg((recover?L('Mất kết nối, đang nối lại... ','Connection lost, reconnecting... '):L('Đang kết nối máy chủ... ','Connecting to server... '))+'('+(n+1)+'/'+MAX+')','busy');setTimeout(()=>attempt(n+1),recover?Math.min(800*n,4000):600)}

  peer.on('open',()=>{if(!first)return;first=false; /* 'open' có thể bắn lại khi nối lại tín hiệu: chỉ xử lý lần đầu */

function bindGuest(net,c,x){const code=net.code;

  net.opened=true;net.linking=false;x.stop();hbStart(c,()=>{try{c.close()}catch(e){}});
  if(x.resume)c.send({t:'resume',seat:net.seat,token:net.token});else c.send({t:'hello',cfg:ST.me,cid:net.cid});
  netMsg((x.recover?L('Đã nối lại phòng ','Reconnected to room '):L('Đã vào phòng ','Joined room '))+code,'ok');
  if(!x.recover){show('lobby');renderLobby()}else if(!net.inGame)renderLobby();if(VC.on){setTimeout(voiceSync,600);setTimeout(micSync,700)}});
 c.on('data',m=>{if(net.conn!==c)return;c._last=Date.now();if(!m||!m.t||m.t==='ping')return;
  if(m.t==='lobby'){net.list=m.list;renderLobby()}
  else if(m.t==='full'){if(x.recover){toast(L('Không thể vào lại ván đấu','Could not rejoin the game'));leave()}else netFail(uerr('Phòng đã đầy hoặc ván đấu đã bắt đầu.'))}
  else if(m.t==='start'){net.seat=m.seat;net.token=m.token;net.inGame=true;ST.myIds=[m.seat];G=m.G;rewarded=false;lastFx=0;Q=[];running=false;debtShown=null;closeModal();show('game');buildBoard();afterChange()}
  else if(m.t==='state'){G=m.G;if($('#game').classList.contains('on'))afterChange()}
  else if(m.t==='peers'){net.peerIds=Array.isArray(m.ids)?m.ids.filter(x=>typeof x==='string').slice(0,8):[];if(VC.on)voiceSync()}
  else if(m.t==='mics'){net.mics=(m.m&&typeof m.m==='object')?m.m:{};micRefresh();micPaint()}else if(m.t==='spks'){net.spks=(m.m&&typeof m.m==='object')?m.m:{};micPaint()}
  else if(m.t==='bye'){net.hostLeft=true;toast('Chủ phòng đã thoát');leave()}
  else if(m.t==='chat')netChatShow(m.seat,m.text)});
 c.on('error',()=>x.retry());
 c.on('close',()=>{if(ST.net!==net||net.conn!==c||net.hostLeft)return;
  if(net.opened){net.opened=false;net.conn=null;if(!net.linking)guestLink(net,true)}else x.retry()})}

function spyHumans(){const n=ST.net;if(!n)return[];return [{name:ST.me.name,cfg:ST.me,seat:0},...n.conns.filter(c=>c.cfg&&c.seat!=null).map(c=>({name:c.cfg.name,cfg:c.cfg,seat:c.seat}))]}

/* ----- Engine (chỉ chạy trên máy chủ phòng) ----- */
function spyBegin(){const n=ST.net;if(!n||n.role!=='host')return;spyClamp();
 const hs=spyHumans(),cfg=SP.cfg,total=Math.max(cfg.total,hs.length);if(total<3){toast('Cần tối thiểu 3 người chơi (gồm cả Bot) để bắt đầu. Hãy thêm Bot hoặc mời thêm người.');return}
 const used={},ps=hs.map((h,i)=>{let nm=String(h.name||'Khách'),k=1;while(used[nm])nm=h.name+' '+(++k);used[nm]=1;return{id:i,name:nm,cfg:h.cfg,bot:0,alive:true,hs:[]}});
 for(let i=ps.length;i<total;i++){let c=randCfg(),k=0;while(used[c.name]&&k++<30)c=randCfg();used[c.name]=1;ps.push({id:i,name:c.name,cfg:c,bot:ST.lvl,alive:true,hs:[]})}

 const pr=spyPick(tp.p),sw=rnd(2),A={w:pr[0],h:pr[2]},B={w:pr[1],h:pr[3]},civ=sw?B:A,spy=sw?A:B;
 const m=spyMax(total),cs=Math.min(m,cfg.spies),cb=Math.min(m-cs,cfg.blanks);
 const roles=shuffle([...Array(cs).fill('spy'),...Array(cb).fill('blank'),...Array(total-cs-cb).fill('civ')]);
 ps.forEach((p,i)=>{p.role=roles[i];p.word=p.role==='civ'?civ.w:(p.role==='spy'&&cfg.hint==='pair')?spy.w:null});
 SP.chat=SP.chat.filter(x=>!x.sys);
 const S={ph:'',round:1,ps,order:[],ti:-1,turn:-1,dl:0,votes:{},ready:{},tally:null,win:null,civ,spy,tp,guess:-1,gres:null,gdone:false,tie:0,picks:{},talk:{},cs,cb,chint:cfg.hint};

 n.conns.forEach(c=>{if(c.open&&c.seat!=null)try{c.send({t:'start',seat:c.seat,token:c.token,V:spyView(c.seat)})}catch(e){}});

function spyView(seat){const S=SP.S,me=S.ps[seat]||S.ps[0],over=S.ph==='over';
 const know=me.role==='civ'||(me.role==='spy'&&S.chint==='pair')?'civ':me.role;
 return{ph:S.ph,round:S.round,tn:S.tp.n,te:S.tp.e,turn:S.turn,tk:Object.keys(S.talk||{}).filter(k=>S.talk[k]>Date.now()).map(Number),left:S.dl?Math.max(0,S.dl-Date.now()):0,
  ps:S.ps.map(p=>({id:p.id,name:p.name,cfg:p.cfg,bot:!!p.bot,dc:!!p.dc,alive:p.alive,hs:p.hs,voted:S.votes[p.id]!=null,ready:!!S.ready[p.id],role:(over||!p.alive)?p.role:null})),
  me:{id:me.id,know,word:me.word,alive:me.alive,role:(over||!me.alive)?me.role:null},
  tally:(S.ph==='reveal'||S.ph==='guess'||over)?S.tally:null,win:S.win,guess:S.guess,gres:S.gres,words:over?[S.civ.w,S.spy.w]:null,cs:S.cs,cb:S.cb}}
function spyPush(){const n=ST.net,S=SP.S;if(!S)return;SP.V=spyView(0);SP.dl=SP.V.left?Date.now()+SP.V.left:0;

function spyPhase(ph,ms){const S=SP.S;if(!S)return;S.ph=ph;S.talk={};S.dl=ms?Date.now()+ms:0;clearTimeout(SP.tm);SP.tm=ms?setTimeout(()=>spyTimeout(ph),ms+80):0;spyPush();spyBotKick()}
function spyTimeout(ph){const S=SP.S;if(!S||S.ph!==ph)return;
 if(ph==='describe')spySay(S.turn,'',true);else if(ph==='discuss')spyVoteStart();else if(ph==='vote'){spyAutoPick();spyTally()}else if(ph==='reveal')spyAfterReveal();else if(ph==='guess')spyGuess(S.guess,'',true)}
function spyNext(){const S=SP.S;S.ti++;if(S.ti>=S.order.length)return spyDisc();S.turn=S.order[S.ti];const p=S.ps[S.turn];spyPhase('describe',spyAuto(p)?0:SPT.desc)}
function spyRej(id,msg){if(id===0)toast(msg);else{const c=ST.net&&ST.net.conns.find(q=>q.seat===id);if(c&&c.open)try{c.send({t:'rej',msg})}catch(e){}}}
function spySay(id,text,force){const S=SP.S;if(!S||S.ph!=='describe'||S.turn!==id)return;const p=S.ps[id];if(!p||!p.alive)return;
 text=String(text||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,48);

 if(ST.net)netClose();SP.active=true;const my=++NET_SEQ;wakeOn();netMsg(L('Đang kết nối máy chủ...','Connecting to server...'),'busy');
 try{await loadPeer()}catch(e){return netFail(e)}
 if(my!==NET_SEQ)return;
 netMsg(L('Đang thu thập ICE...','Gathering ICE candidates...'),'busy');await loadIce();if(my!==NET_SEQ)return;await warmIce(4500);if(my!==NET_SEQ)return;
 const net={role:'guest',spy:true,code,hostId:SPID(code),peer:null,conn:null,opened:false,inGame:true,seat:null,token:null,started:false,hostLeft:false,linking:false,cid:Math.random().toString(36).slice(2,10)};

function spyGuestLink(net,recover){
 const code=net.code,resume=!!(recover&&net.started),MAX=recover?8:3;net.linking=true;
 const fail=err=>{net.linking=false;if(ST.net!==net)return;
  if(recover){toast(L('Mất kết nối với phòng','Lost connection to the room'));spyLeave()}else netFail(err||uerr('Không kết nối được tới phòng '+code+'. Mạng có thể đang chặn kết nối P2P (thử Wi-Fi/4G khác) hoặc chủ phòng đã thoát.'),code)};
 const attempt=n=>{if(ST.net!==net||net.hostLeft)return;
  net.conn=null;try{net.peer&&net.peer.destroy()}catch(e){}
  const relay=n>=2&&ICE_STAT.relay>0;let peer;try{peer=newPeer(null,relay)}catch(e){return fail(e)}
  net.peer=peer;keepPeerAlive(peer,net);peer.on('call',call=>voiceIncoming(net,call));let done=false,tmo=0,first=true;
  const retry=err=>{if(done||net.opened||ST.net!==net)return;done=true;clearTimeout(tmo);
   if(n<MAX){netMsg((recover?L('Mất kết nối, đang nối lại... ','Connection lost, reconnecting... '):L('Đang kết nối máy chủ... ','Connecting to server... '))+'('+(n+1)+'/'+MAX+')','busy');setTimeout(()=>attempt(n+1),recover?Math.min(800*n,4000):600)}
   else fail(err)};
  tmo=setTimeout(()=>retry(uerr('Máy chủ kết nối không phản hồi. Kiểm tra mạng hoặc thử lại sau ít phút.')),12000);
  peer.on('error',e=>{if(e&&e.type==='peer-unavailable'){if(n<(recover?MAX:2))retry(e);else{done=true;clearTimeout(tmo);fail(e)}}else retry(e)});
  peer.on('open',()=>{if(!first)return;first=false;if(ST.net!==net||done)return;clearTimeout(tmo);
   netMsg(L('Đang tìm phòng ','Looking for room ')+code+'...'+(n>1?' ('+n+'/'+MAX+')':'')+(relay?L(' · qua máy chủ chuyển tiếp',' · via relay'):''),'busy');
   const c=peer.connect(net.hostId,{serialization:'json',reliable:true});net.conn=c;
   spyBindGuest(net,c,{recover,resume,retry,done:()=>done,stop:()=>clearTimeout(tmo)});
   tmo=setTimeout(()=>retry(),18000)})};
 attempt(1)}
function spyApply(V){SP.V=V;SP.dl=V.left?Date.now()+V.left:0;SP.view='game';show('spy');spyRender()}
function spyBindGuest(net,c,x){const code=net.code;
 c.on('iceStateChanged',st=>{if(st==='failed'&&!net.opened)x.retry(uerr(NET_BLOCKED))});
 c.on('open',()=>{if(x.done()||ST.net!==net||net.conn!==c)return;
  net.opened=true;net.linking=false;x.stop();hbStart(c,()=>{try{c.close()}catch(e){}});
  if(x.resume)c.send({t:'resume',seat:net.seat,token:net.token});else c.send({t:'hello',cfg:ST.me,cid:net.cid});
  netMsg((x.recover?L('Đã nối lại phòng ','Reconnected to room '):L('Đã vào phòng ','Joined room '))+code,'ok');
  if(!x.recover){SP.view='lobby';show('spy');spyRender()}
  if(VC.on){setTimeout(voiceSync,600);setTimeout(micSync,700)}});
 c.on('data',m=>{if(net.conn!==c)return;c._last=Date.now();if(!m||!m.t||m.t==='ping')return;
  if(m.t==='lobby'){net.seat=m.you;SP.list=m.list||[];SP.cfg=Object.assign(SP.cfg,m.cfg||{});if(m.lvl)ST.lvl=m.lvl;if(SP.V||SP.view==='game'){SP.V=null;net.started=false}SP.view='lobby';SP.tab='play';show('spy');spyRender()}
  else if(m.t==='full'){if(x.recover){toast(L('Không thể vào lại ván đấu','Could not rejoin the game'));spyLeave()}else netFail(uerr('Phòng đã đầy hoặc ván đấu đã bắt đầu.'))}
  else if(m.t==='start'){net.seat=m.seat;net.token=m.token;net.started=true;if(!m.resume)SP.tab='play';spyApply(m.V);if(m.resume&&SP.myVote!=null&&!SP.vlock)spyDraftSend(SP.myVote)}
  else if(m.t==='st'){spyApply(m.V)}
  else if(m.t==='hist'){SP.chat=Array.isArray(m.list)?m.list.slice(-150):[];spyChatRedraw()}
  else if(m.t==='chat'&&m.m){SP.chat.push(m.m);if(SP.chat.length>150)SP.chat.shift();spyChatDraw(m.m)}
  else if(m.t==='rej')toast(String(m.msg||'').slice(0,80))
  else if(m.t==='emo')spyEmoShow(+m.id,String(m.e))
  else if(m.t==='peers'){net.peerIds=Array.isArray(m.ids)?m.ids.filter(q=>typeof q==='string').slice(0,8):[];if(VC.on)voiceSync()}
  else if(m.t==='mics'){net.mics=(m.m&&typeof m.m==='object')?m.m:{};micRefresh();micPaint()}else if(m.t==='spks'){net.spks=(m.m&&typeof m.m==='object')?m.m:{};micPaint()}
  else if(m.t==='bye'){net.hostLeft=true;toast('Chủ phòng đã thoát');spyLeave()}});
 c.on('error',()=>x.retry());
 c.on('close',()=>{if(ST.net!==net||net.conn!==c||net.hostLeft)return;
  if(net.opened){net.opened=false;net.conn=null;if(!net.linking)spyGuestLink(net,true)}else x.retry()})}
